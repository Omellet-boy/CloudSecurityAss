server {
    # 1. Redirect all HTTP traffic to HTTPS
    listen 80;
    server_name alumniportal.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    # 2. Terminate SSL/TLS on Port 443
    listen 443 ssl http2;
    server_name alumniportal.yourdomain.com;

    # SSL Certificate Locations (Generate these using Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/alumniportal.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alumniportal.yourdomain.com/privkey.pem;

    # Strong TLS Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 3. Serve the React Frontend (Static Files)
    location / {
        root /var/www/alumni-frontend/dist; # Path to your built React app (npm run build)
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 4. Reverse Proxy for Node.js Backend API
    location /api/ {
        # Forward requests to Node.js backend
        proxy_pass http://127.0.0.1:3000/; 
        
        # Security headers for proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent timeouts on heavy database queries
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
